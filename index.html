<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <title>Three.js Netflix</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas class="webgl1"></canvas>

    <div id="quiz-overlay">
        <div id="quiz-panel">
            <div id="quiz-close">✕</div>
            <div id="quiz-label">🎬 Quiz Cinéma</div>
            <div id="quiz-question">Quel est le nom de ce film ?</div>
            <div id="quiz-input-row">
                <input id="quiz-input" type="text" placeholder="Saisi ta réponse..." autocomplete="off" spellcheck="false" />
                <button id="quiz-submit">VALIDER</button>
            </div>
            <div id="quiz-feedback"></div>
            <div id="movie-info">
                <img id="movie-poster" src="" alt="Poster" />
                <div id="movie-details">
                    <div id="movie-title-text"></div>
                    <div id="movie-year"></div>
                    <div id="movie-plot"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
